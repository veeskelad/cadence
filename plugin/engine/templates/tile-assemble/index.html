<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cadence — tile assemble</title>
    <!--
      Слово или логотип собирается из тысяч плиток (галерея Opus 5.5: zeezomb-726206 «мозаика»,
      mounnna-497266 «логотип из осколков»). Плитки прилетают по дуге из вихря, переворачиваются,
      вспыхивают акцентом и встают на место; по готовой мозаике проходит блик.
      Источник: data-word (текст) или assets/source.png (data-src="assets/source.png").
    -->
    <!-- cadence:fonts -->
    <style>
      :root {
        /* cadence:tokens design/packs/cadence-ember/pack.json */
        --canvas: #0e0c0b;
        --surface: #1c1917;
        --ink: #f0eee6;
        --muted: #a39d94;
        --signal: #d97757;
        --signal-2: #f2a65a;
        --line: #3a332e;
        /* /cadence:tokens */
      }
      html, body { margin: 0; background: var(--canvas); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #fill { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 50%, var(--surface), var(--canvas)); }
      #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #sub { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font: 500 30px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tile-assemble" data-start="0" data-width="1080" data-height="1920" data-duration="7" data-no-timeline
      data-word="CADENCE" data-src="" data-sub="собрано кодом" data-tile="12" data-rupture="0" data-seed="5">
      <section id="scene" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="fill"></div>
        <canvas id="cv"></canvas>
        <div id="sub"></div>
      </section>
    </div>
    <script type="module">
      import {bindSeek, stage, token, spring, expoOut, expoIn, invLerp, lerp, clamp, rng, smoothstep} from './lib/motion.js';

      const {root, width, height, duration} = stage();
      const cfg = root.dataset;
      const T = Number(cfg.tile);
      const cv = document.getElementById('cv');
      cv.width = width; cv.height = height;
      const g = cv.getContext('2d');
      const sub = document.getElementById('sub');
      sub.textContent = cfg.sub;
      const rand = rng(Number(cfg.seed));

      // Источник рисуется в сетку плиток: одна плитка = один пиксель маски.
      const cols = Math.floor(width / T), rows = Math.floor(height / T);
      const mask = document.createElement('canvas');
      mask.width = cols; mask.height = rows;
      const mg = mask.getContext('2d', {willReadFrequently: true});
      if (cfg.src) {
        const img = new Image();
        img.src = cfg.src;
        await img.decode();
        const s = Math.min((cols * 0.86) / img.width, (rows * 0.5) / img.height);
        mg.drawImage(img, (cols - img.width * s) / 2, (rows - img.height * s) / 2 - rows * 0.04, img.width * s, img.height * s);
      } else {
        await document.fonts.load('800 100px Onest');
        const big = document.createElement('canvas');
        big.width = width; big.height = height;
        const bg = big.getContext('2d');
        bg.fillStyle = '#fff';
        bg.textAlign = 'center'; bg.textBaseline = 'middle';
        let size = 400;
        bg.font = `800 ${size}px Onest, sans-serif`;
        size *= Math.min(1, (width * 0.86) / bg.measureText(cfg.word).width);
        bg.font = `800 ${size}px Onest, sans-serif`;
        bg.fillText(cfg.word, width / 2, height * 0.46);
        mg.drawImage(big, 0, 0, cols, rows);
      }
      const px = mg.getImageData(0, 0, cols, rows).data;

      const ink = token('--ink'), signal = token('--signal'), signal2 = token('--signal-2');
      const tiles = [];
      const cx = width / 2, cy = height * 0.46;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const i = (r * cols + c) * 4;
        if (px[i + 3] < 110) continue;
        const x = c * T, y = r * T;
        // Старт — вихрь вокруг центра; задержка растёт от центра к краям плюс шум.
        const ang = rand() * Math.PI * 2, rad = 500 + rand() * 900;
        const dist = Math.hypot(x - cx, y - cy);
        tiles.push({
          x, y,
          sx: cx + Math.cos(ang) * rad, sy: cy + Math.sin(ang) * rad * 1.3,
          delay: 0.3 + (dist / width) * 1.6 + rand() * 0.5,
          spin: (rand() < 0.5 ? -1 : 1) * (2 + Math.floor(rand() * 3)) * Math.PI,
          color: cfg.src ? `rgb(${px[i]},${px[i + 1]},${px[i + 2]})` : (rand() < 0.1 ? signal : ink),
          shade: 0.82 + rand() * 0.18,
          arc: (rand() - 0.5) * 600,
          out: rand() * Math.PI * 2,
        });
      }

      const holdEnd = duration - (cfg.rupture === '1' ? 1.2 : 0);
      function render(t) {
        g.clearRect(0, 0, width, height);
        // Собранная мозаика не стоит: кадр медленно наезжает, по плиткам бежит волна света,
        // блик проходит дважды.
        const push = 1 + 0.07 * smoothstep(2.4, duration, t);
        g.setTransform(push, 0, 0, push, cx * (1 - push), cy * (1 - push));
        const glint = t < 5 ? invLerp(3.2, 4.4, t) : invLerp(5.4, 6.4, t);   // диагональный блик по мозаике
        const settled = smoothstep(2.6, 3.4, t);
        for (const p of tiles) {
          const k = spring(t - p.delay, 7, 0.82);                      // полёт с лёгким перелётом
          const f = clamp(k);
          let x = lerp(p.sx, p.x, k) + Math.sin(f * Math.PI) * p.arc;
          let y = lerp(p.sy, p.y, k);
          let a = smoothstep(0, 0.15, t - p.delay + 0.15);
          if (t > holdEnd) {                                            // разрыв: плитки уходят наружу
            const e = expoIn(invLerp(holdEnd, duration, t));
            x += Math.cos(p.out) * e * 1400; y += Math.sin(p.out) * e * 1400;
            a *= 1 - e;
          }
          if (a <= 0) continue;
          const flip = Math.cos((1 - f) * p.spin);                      // переворот плитки = сжатие по X
          const flash = smoothstep(0.08, 0, Math.abs(t - p.delay - 0.9));
          const band = Math.abs((p.x + p.y) / (width + height) - glint);
          const shine = glint > 0 && glint < 1 ? smoothstep(0.05, 0, band) : 0;
          const w = (T - 2) * Math.max(0.08, Math.abs(flip));
          g.globalAlpha = a;
          g.fillStyle = flash > 0.02 ? signal2 : p.color;
          g.fillRect(x + (T - 2 - w) / 2 + 1, y + 1, w, T - 2);
          const wave = settled * 0.16 * Math.sin(t * 2.6 - (p.x * 0.8 + p.y) / 140);
          const light = (flip < 0 ? 0.55 : p.shade) + shine * 0.95 + wave;
          if (light !== 1) {
            g.fillStyle = light > 1 ? `rgba(255,255,255,${light - 1})` : `rgba(0,0,0,${1 - light})`;
            g.fillRect(x + (T - 2 - w) / 2 + 1, y + 1, w, T - 2);
          }
        }
        g.globalAlpha = 1;
        g.setTransform(1, 0, 0, 1, 0, 0);
        const s = expoOut(invLerp(3.8, 4.6, t)) * (t > holdEnd ? 1 - invLerp(holdEnd, holdEnd + 0.4, t) : 1);
        sub.style.opacity = s;
        sub.style.transform = `translateY(${(1 - s) * 20}px)`;
      }
      bindSeek(render);
    </script>
  </body>
</html>
